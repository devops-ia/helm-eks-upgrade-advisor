{{/*
Read-only RBAC for ArgoCD Application discovery — get/list on
applications.argoproj.io (and namespaces, when scoped cluster-wide). This is
the tool's core discovery mechanism, not an opt-in feature.
*/}}
{{- if and .Values.rbac.create .Values.serviceAccount.create }}
{{- if .Values.rbac.namespaced }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "eks-upgrade-advisor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eks-upgrade-advisor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "eks-upgrade-advisor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eks-upgrade-advisor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "eks-upgrade-advisor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eks-upgrade-advisor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eks-upgrade-advisor.fullname" . }}
  labels:
    {{- include "eks-upgrade-advisor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eks-upgrade-advisor.fullname" . }}
  labels:
    {{- include "eks-upgrade-advisor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eks-upgrade-advisor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eks-upgrade-advisor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
